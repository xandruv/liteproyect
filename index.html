  rows[hi].forEach((h, i) => {
    const n = norm(xlStr(h)); if (!n) return;
    const set = k => { if (col[k] == null) col[k] = i; };
    if (n === "id") set("id"); else if (n.startsWith("proyecto")) set("proj"); else if (n.startsWith("fecha")) set("date");
    else if (n.startsWith("concepto")) set("concept"); else if (n.startsWith("importe")) set("amount");
    else if (n.includes("documento") || n.startsWith("factura")) set("doc"); else if (n.startsWith("tarea")) set("task");
    else if (n.includes("elemento") || n.includes("acopio")) set("item"); else if (n.startsWith("cantidad")) set("qty");
    else if (n.startsWith("unidad")) set("unit"); else if (n.startsWith("precio")) set("price");
  });
  const scope = scopePid ? getP(scopePid) : null;
  const byName = new Map(); Object.values(S.projects).forEach(p => { const k = norm(p.name); byName.set(k, byName.has(k) ? "dup" : p); });
  const plans = new Map(), errors = []; let skipped = 0, read = 0;
  const planOf = p => { if (!plans.has(p.id)) plans.set(p.id, { p, creates: [], updates: [], same: 0, newItems: new Map(), seen: new Set(), errs: 0 }); return plans.get(p.id); };
  const get = (r, k) => col[k] == null ? "" : r[col[k]];
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || [], line = i + 1;
    if (!r.some(c => xlStr(c) !== "")) continue;
    read++;
    const err = msg => errors.push({ line, msg });
    /* proyecto */
    let p; const pname = xlStr(get(r, "proj"));
    if (scope) { if (pname && norm(pname) !== norm(scope.name)) { skipped++; continue; } p = scope; }
    else {
      if (!pname) { err("falta el nombre del proyecto"); continue; }
      const f = byName.get(norm(pname));
      if (!f) { err(`el proyecto «${pname}» no existe`); continue; }
      if (f === "dup") { err(`hay varios proyectos llamados «${pname}»`); continue; }
      p = f;
    }
    const plan = planOf(p);
    const errP = msg => { plan.errs++; err(msg); };
    /* campos */
    const date = xlDate(get(r, "date")); if (!date) { errP("fecha vacía o no válida"); continue; }
    const itemName = xlStr(get(r, "item"));
    const qtyRaw = get(r, "qty"), priceRaw = get(r, "price"), amountRaw = get(r, "amount");
    let qty = null, unitPrice = null, amount = xlStr(amountRaw) === "" ? NaN : xlNum(amountRaw);
    if (itemName) {
      qty = xlNum(qtyRaw); if (!(qty > 0)) { errP(`indica la cantidad comprada de «${itemName}»`); continue; }
      const pr = xlStr(priceRaw) === "" ? NaN : xlNum(priceRaw);
      if (!isFinite(amount) && isFinite(pr)) amount = pr * qty;
    }
    if (!isFinite(amount) || amount < 0) { errP("importe vacío o no válido"); continue; }
    amount = round(amount); if (itemName) { qty = round(qty, 4); unitPrice = round(amount / qty, 4); }
    let taskId = null; const tv = xlStr(get(r, "task"));
    if (tv) { const mt = matchTask(p, tv); if (mt.error) { errP(mt.error); continue; } taskId = mt.id; }
    let itemId = null, itemKey = null;
    if (itemName) {
      const found = p.items.filter(it => norm(it.name) === norm(itemName));
      if (found.length > 1) { errP(`hay varios elementos de acopio llamados «${itemName}»`); continue; }
      if (found.length) itemId = found[0].id;
      else { itemKey = norm(itemName); if (!plan.newItems.has(itemKey)) plan.newItems.set(itemKey, { id: uid(), name: itemName, unit: xlStr(get(r, "unit")) || "ud" }); itemId = plan.newItems.get(itemKey).id; }
    }
    const fields = { date, amount, concept: xlStr(get(r, "concept")) || (itemName ? "Compra: " + itemName : "Gasto"), docNumber: xlStr(get(r, "doc")), taskId, itemId };
    if (itemId) { fields.qty = qty; fields.unitPrice = unitPrice; }
    /* alta o modificación */
    const id = xlStr(get(r, "id"));
    const cur = id ? p.costs.find(c => c.id === id) : null;
    if (cur) {
      if (plan.seen.has(id)) { errP("el ID está repetido en el archivo"); continue; }
      plan.seen.add(id);
      const same = cur.date === fields.date && round(cur.amount) === fields.amount && cur.concept === fields.concept && (cur.docNumber || "") === fields.docNumber
        && (cur.taskId || null) === fields.taskId && (cur.itemId || null) === fields.itemId && (!fields.itemId || round(cur.qty, 4) === fields.qty);
      if (same) plan.same++; else plan.updates.push({ id, fields });
    } else plan.creates.push(fields);
  }
  /* Solo se ofrece borrar lo que falta si el proyecto no tiene filas con errores (evita borrados por filas mal escritas) */
  plans.forEach(pl => { pl.deletes = pl.errs ? [] : pl.p.costs.filter(c => !pl.seen.has(c.id)).map(c => c.id); });
  return { plans: [...plans.values()], errors, skipped, read };
}
function applyCostsImport(plan, withDeletes) {
  if (!Store.canWrite()) return;
  let n = 0, raised = 0;
  plan.plans.forEach(pl => {
    const p = getP(pl.p.id); if (!p) return;
    const newIds = new Set([...pl.newItems.values()].map(it => it.id));
    pl.newItems.forEach(it => p.items.push({ id: it.id, createdAt: Date.now(), name: it.name, description: "", qtyNeeded: 1, unit: it.unit, folderId: null, estPrice: null, taskId: null, url: "" }));
    pl.creates.forEach(f => { p.costs.push({ id: uid(), createdAt: Date.now(), ...f }); n++; });
    pl.updates.forEach(u => { const c = p.costs.find(x => x.id === u.id); if (!c) return; Object.assign(c, u.fields); if (!c.itemId) { delete c.qty; delete c.unitPrice; } n++; });
    if (withDeletes && pl.deletes.length) { const del = new Set(pl.deletes); p.costs = p.costs.filter(c => !del.has(c.id)); n += del.size; }
    p._rev++;
    p.items.forEach(i => { const acq = round(sum(p.costs.filter(c => c.itemId === i.id).map(c => c.qty)), 4); if (newIds.has(i.id)) i.qtyNeeded = Math.max(acq, 1); else if (acq > i.qtyNeeded + EPS) { i.qtyNeeded = acq; raised++; } });
    Store.save(p.id);
  });
  toast(`Excel importado: ${plural(n, "cambio")} aplicado${n === 1 ? "" : "s"}${raised ? ` · ${plural(raised, "elemento")} con cantidad necesaria actualizada` : ""}`);
}
async function importCostsXlsx(file, scopePid) {
  let book;
  try { book = await readXlsx(await file.arrayBuffer()); }
  catch (e) { return toast(e.message || "No se pudo leer el archivo", true); }
  const name = book.names.find(n => norm(n) === "gastos") || book.names[0];
  if (!name) return toast("El archivo no tiene hojas", true);
  let plan;
  try { plan = planCostsImport(book.sheets[name], scopePid); } catch (e) { return toast(e.message, true); }
  const totals = plan.plans.reduce((a, pl) => a + pl.creates.length + pl.updates.length + pl.newItems.size, 0);
  const dels = plan.plans.reduce((a, pl) => a + pl.deletes.length, 0);
  const blocks = plan.plans.map(pl => `<div class="buyinfo"><b>${esc(pl.p.name)}</b><div class="q">
      <span>${plural(pl.creates.length, "gasto nuevo", "gastos nuevos")}</span><span>${plural(pl.updates.length, "modificado", "modificados")}</span><span>${pl.same} sin cambios</span>
      ${pl.newItems.size ? `<span>${plural(pl.newItems.size, "elemento de acopio nuevo", "elementos de acopio nuevos")}</span>` : ""}
      ${pl.deletes.length ? `<span class="over">${pl.deletes.length} no están en el archivo</span>` : ""}</div></div>`).join("");
  const errs = plan.errors.length ? `<div class="calc warn"><span>${plural(plan.errors.length, "fila con errores", "filas con errores")}: no se importará${plan.errors.length === 1 ? "" : "n"}.</span></div>
      <ul style="margin:0;padding-left:20px;font-size:13px;color:var(--muted)">${plan.errors.slice(0, 12).map(e => `<li>Fila ${e.line}: ${esc(e.msg)}</li>`).join("")}${plan.errors.length > 12 ? `<li>…y ${plan.errors.length - 12} más</li>` : ""}</ul>` : "";
  if (!totals && !dels) {
    return infoModal("Importar Excel", `Hoja «${esc(name)}»: ${plural(plan.read, "fila leída", "filas leídas")}. No hay cambios que aplicar.${plan.errors.length ? "<br><br>" + plan.errors.slice(0, 12).map(e => `Fila ${e.line}: ${esc(e.msg)}`).join("<br>") : ""}`);
  }
  openModal({
    title: "Importar gastos desde Excel", submit: "Importar",
    body: `<p>Hoja «${esc(name)}» · ${plural(plan.read, "fila leída", "filas leídas")}${plan.skipped ? ` · ${plan.skipped} de otros proyectos omitidas` : ""}.</p>
      ${blocks}${errs}
      ${dels ? `<label class="switch"><input type="checkbox" name="del"><span>Eliminar también los ${plural(dels, "gasto")} que no aparecen en el archivo</span></label>` : ""}
      <p class="note">Los gastos nuevos y modificados se guardarán en tu cuenta. Las compras de acopio actualizan las cantidades adquiridas.</p>`,
    onSubmit(d) { applyCostsImport(plan, d.del === "on"); }
  });
}

/* ---- Copia de seguridad ---- */
function saveFile(filename, data, type) {
  try {
    const blob = new Blob([data], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return true;
  } catch (e) { toast("No se pudo descargar el archivo", true); return false; }
}
function exportBackup() {
  const o = {}; Object.values(S.projects).forEach(p => o[p.id] = fullDoc(p));
  const data = JSON.stringify({ app: "LiteProyect", version: 2, exportedAt: new Date().toISOString(), projects: o, images: S.images });
  if (saveFile(`liteproyect-copia-${today()}.json`, data, "application/json")) toast("Copia descargada");
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    let data; try { data = JSON.parse(r.result); } catch (e) { return toast("El archivo no es una copia válida", true); }
    const projs = data && data.projects && typeof data.projects === "object" ? data.projects : null;
    if (!projs || data.app !== "LiteProyect") return toast("El archivo no es una copia de LiteProyect", true);
    const ids = Object.keys(projs).filter(id => /^[a-z0-9]+$/.test(id));
    const repl = ids.filter(id => S.projects[id]).length;
    confirmModal("Importar copia de seguridad", `Se importarán ${plural(ids.length, "proyecto")}.${repl ? ` ${repl} ya existe${repl === 1 ? "" : "n"} y se sustituirá${repl === 1 ? "" : "n"} por la versión de la copia.` : ""}`, "Importar", () => {
      if (!Store.canWrite()) return;
      ids.forEach(id => { S.projects[id] = normalize(projs[id], id); Store.save(id); const img = data.images && data.images[id]; if (img && /^data:image\//.test(img)) Store.setImage(id, img); });
      toast("Copia importada");
    });
  };
  r.readAsText(file);
}

function quickAdd(kind, text) {
  text = text.trim(); if (!text) return;
  mutate(p => {
    if (kind === "task") {
      const roots = p.tasks.filter(t => !t.parentId);
      p.tasks.push({ id: uid(), createdAt: Date.now(), order: roots.length ? Math.max(...roots.map(x => x.order)) + 1 : 0, title: text.slice(0, 120), description: "", status: "pendiente", priority: "media", parentId: null, startDate: "", dueDate: "", endDate: "", estExtra: null });
    } else if (kind === "work") {
      const tags = (text.match(/#([^\s#,]+)/g) || []).map(t => t.slice(1));
      const title = text.replace(/#[^\s#,]+/g, "").replace(/\s+/g, " ").trim() || text;
      p.works.push({ id: uid(), createdAt: Date.now(), title: title.slice(0, 160), description: "", status: "pendiente", tags: mergeTags(tags), taskId: null, startDate: "", endDate: "", doneDate: "", recur: null });
    } else if (kind === "item") {
      let name = text, qty = 1, unit = "ud";
      const m = /^(.*?)[,;]\s*([\d.,]+)\s*([^\d\s].*)?$/.exec(text);
      if (m && parseNum(m[2]) > 0) { name = m[1].trim(); qty = parseNum(m[2]); unit = (m[3] || "ud").trim(); }
      p.items.push({ id: uid(), createdAt: Date.now(), name: name.slice(0, 200), description: "", qtyNeeded: round(qty, 4), unit, folderId: null, estPrice: null, taskId: null, url: "" });
    }
  });
}

  if (e.target.id === "importFile") { const f = e.target.files[0]; if (f) importBackup(f); return; }
  if (e.target.id === "xlsxFile") { const f = e.target.files[0]; if (f) importCostsXlsx(f, S.ui.xlsxScope); return; }
  if (e.target.closest("#modal-root")) return;
  const el = e.target.closest("[data-chg]"); if (!el) return;
  const fn = CHG[el.dataset.chg]; if (fn) fn(el);
});
document.addEventListener("input", e => {
  if (e.target.closest("#modal-root")) return;
  const el = e.target.closest("[data-inp]"); if (!el) return;
  const fn = INP[el.dataset.inp]; if (fn) { fn(el); render(); }
});
document.addEventListener("keydown", e => {
  const el = e.target;
  if (e.key === "Enter" && el.dataset && el.dataset.quick && !e.isComposing) {
    e.preventDefault(); const v = el.value; el.value = ""; quickAdd(el.dataset.quick, v);
  }
});

/* =========================================================
   Arrastrar tareas (ratón y táctil, con pointer events)
   ========================================================= */
let drag = null;
document.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-drag]"); if (!h || (e.button && e.button !== 0)) return;
  const p = P(); if (!p) return;
  const table = h.closest(".ttable"); if (!table) return;
  e.preventDefault();
  const id = h.dataset.drag;
  const sub = new Set([id, ...descendants(p, id)]);
  const rows = [...table.querySelectorAll(".trow[data-id]")];
  rows.forEach(r => { if (sub.has(r.dataset.id)) r.classList.add("dragging"); });
  drag = { id, pid: p.id, sub, table, lastRow: rows[rows.length - 1], rows: rows.filter(r => !sub.has(r.dataset.id)), ind: table.querySelector(".drop-ind"), target: null, pos: null, over: null };
  try { h.setPointerCapture(e.pointerId); } catch (ex) { }
  document.body.classList.add("is-dragging");
});
document.addEventListener("pointermove", e => {
  if (!drag || drag.justEnded) return;
  e.preventDefault();
  const y = e.clientY;
  if (y < 70) window.scrollBy(0, -14); else if (y > window.innerHeight - 70) window.scrollBy(0, 14);
  if (drag.over) { drag.over.classList.remove("drop-in"); drag.over = null; }
  drag.ind.style.display = "none"; drag.target = null;
  if (!drag.rows.length) return;
  const last = drag.rows[drag.rows.length - 1].getBoundingClientRect();
  if (y > last.bottom) { drag.target = "__end"; drag.pos = "end"; drag.ind.style.top = (drag.lastRow.offsetTop + drag.lastRow.offsetHeight) + "px"; drag.ind.style.display = "block"; return; }
  let r = drag.rows.find(x => { const b = x.getBoundingClientRect(); return y >= b.top && y <= b.bottom; });
  if (!r) { const first = drag.rows[0]; if (y < first.getBoundingClientRect().top) r = first; else return; }
  const b = r.getBoundingClientRect(); const rel = (y - b.top) / b.height;
  drag.target = r.dataset.id;
  if (rel < 0.3) { drag.pos = "before"; drag.ind.style.top = r.offsetTop + "px"; drag.ind.style.display = "block"; }
  else if (rel > 0.7) { drag.pos = "after"; drag.ind.style.top = (r.offsetTop + r.offsetHeight) + "px"; drag.ind.style.display = "block"; }
  else { drag.pos = "inside"; r.classList.add("drop-in"); drag.over = r; }
}, { passive: false });
function endDrag(cancel) {
  if (!drag || drag.justEnded) return;
  const d = drag; d.justEnded = true;
  document.body.classList.remove("is-dragging");
  setTimeout(() => { if (drag === d) drag = null; }, 0);
  if (cancel || !d.target) { render(); return; }
  const p = getP(d.pid);
  if (p && Store.canWrite() && moveTask(p, d.id, d.target, d.pos)) Store.save(p.id); else render();
}
document.addEventListener("pointerup", () => endDrag(false));
document.addEventListener("pointercancel", () => endDrag(true));
function moveTask(p, id, targetId, pos) {
  const t = find(p.tasks, id); if (!t) return false;
  let parent, index;
  if (targetId === "__end") { parent = null; index = Infinity; }
  else {
    const tg = find(p.tasks, targetId); if (!tg || tg.id === id) return false;
    const visKids = kidsOf(p, tg.id).length && !S.ui.collapsedT.has(tg.id);
    if (pos === "inside") { parent = tg.id; index = Infinity; }
    else if (pos === "after" && visKids) { parent = tg.id; index = 0; }
    else { parent = tg.parentId; const sib = kidsOf(p, parent).filter(x => x.id !== id); const i = sib.findIndex(x => x.id === tg.id); index = pos === "before" ? i : i + 1; }
  }
  if (parent && (parent === id || descendants(p, id).includes(parent))) return false;
  const sib = kidsOf(p, parent).filter(x => x.id !== id);
  sib.splice(Math.min(index, sib.length), 0, t);
  t.parentId = parent; sib.forEach((x, i) => x.order = i);
  if (parent) S.ui.collapsedT.delete(parent);
  return true;
}

/* =========================================================
   Arranque
   ========================================================= */
/* ---------- Cuenta (Google) ---------- */
function authMsg(e) {
  const c = e && e.code;
  if (c === "auth/unauthorized-domain") return `Este dominio (${location.hostname}) no está autorizado en Firebase. Añádelo en Authentication › Configuración › Dominios autorizados (paso 5 de la guía).`;
  if (c === "auth/operation-not-allowed") return "El inicio de sesión con Google no está activado en Firebase (paso 2 de la guía).";
  if (c === "auth/network-request-failed") return "Sin conexión: necesitas internet para iniciar sesión la primera vez.";
  return "No se pudo iniciar sesión (" + (c || "error") + ").";
}
async function signIn() {
  if (!FB) return;
  const { au, auth } = FB;
  const prov = new au.GoogleAuthProvider();
  prov.setCustomParameters({ prompt: "select_account" });
  try { await au.signInWithPopup(auth, prov); }
  catch (e) {
    if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/cancelled-popup-request"].includes(e.code)) {
      try { await au.signInWithRedirect(auth, prov); } catch (e2) { toast(authMsg(e2), true); }
    } else if (e.code !== "auth/popup-closed-by-user") toast(authMsg(e), true);
  }
}
function accountModal() {
  const u = S.user || {};
  const pending = Store.local.size > 0 || Store.pendingColl.size > 0;
  openModal({
    title: "Tu cuenta", submit: "Cerrar sesión", danger: true,
    body: `<div class="buyinfo"><b>${esc(u.name || "Cuenta de Google")}</b><div class="q"><span>${esc(u.email || "")}</span></div></div>
      <p>Tus datos se guardan en este dispositivo y se sincronizan con tu cuenta cuando hay conexión. En otro móvil u ordenador, inicia sesión con la misma cuenta para tener todo.</p>
      <p class="note">Estado: ${!navigator.onLine ? "sin conexión" + (pending ? ", con cambios pendientes de subir" : "") : pending ? "sincronizando cambios…" : "todo sincronizado"}.</p>
      ${pending ? `<p class="over" style="font-size:13px">Hay cambios sin subir: si cierras sesión ahora, se perderán. Conéctate a internet y espera a que ponga «Sincronizado».</p>` : ""}`,
    onSubmit() {
      (async () => {
        try { Store.stop(); await FB.au.signOut(FB.auth); try { await FB.fs.terminate(FB.db); await FB.fs.clearIndexedDbPersistence(FB.db); } catch (e) { } }
        finally { location.reload(); }
      })();
    }
  });
}
ACT["sign-in"] = () => signIn();
ACT.account = () => accountModal();
ACT.reload = () => location.reload();

/* =========================================================
   Arranque
   ========================================================= */
(async function boot() {
  S.view = parseHash(location.hash.slice(1));
  S.auth = "loading"; S.canDownload = true;
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => { });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  let cfg = null;
  try { cfg = (await import("./firebase-config.js")).firebaseConfig; } catch (e) { cfg = null; }
  if (!cfg || !cfg.apiKey || !cfg.projectId || /PEGA|TU_/.test(cfg.apiKey)) { S.auth = "setup"; return render(); }
  try {
    const [appM, au, fs] = await Promise.all([
      import(FIREBASE_SDK + "firebase-app.js"), import(FIREBASE_SDK + "firebase-auth.js"), import(FIREBASE_SDK + "firebase-firestore.js")
    ]);
    const app = appM.initializeApp(cfg);
    let db;
    try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
    catch (e) { db = fs.getFirestore(app); }
    const auth = au.getAuth(app);
    auth.languageCode = "es";
    FB = { app, db, auth, fs, au };
    au.getRedirectResult(auth).catch(e => toast(authMsg(e), true));
    au.onAuthStateChanged(auth, user => {
      if (user) {
        S.user = { email: user.email, name: user.displayName, photo: user.photoURL };
        S.auth = "in";
        if (Store.uid !== user.uid) Store.start(user.uid);
      } else { S.auth = "out"; S.user = null; Store.stop(); S.mode = "pending"; }
      render();
    });
  } catch (e) {
    console.error(e);
    S.auth = "fatal";
    S.fatal = navigator.onLine ? "No se pudo cargar Firebase. Comprueba la configuración o inténtalo más tarde." : "Sin conexión. Abre la app una vez con internet para que quede instalada y funcione sin conexión.";
    render();
  }
})();
</script>
